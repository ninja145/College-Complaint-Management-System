services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grievance_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-college_grievance}
      DB_USER: ${DB_USER:-grievance_user}
      DB_PASS: ${DB_PASS:-grievance_pass}
      APP_ENV: ${APP_ENV:-development}
    volumes:
      - .:/var/www/html
      - uploads_data:/var/www/html/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - grievance_network

  db:
    image: mysql:8.0
    container_name: grievance_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_NAME:-college_grievance}
      MYSQL_USER: ${DB_USER:-grievance_user}
      MYSQL_PASSWORD: ${DB_PASS:-grievance_pass}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/grievance_system.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - grievance_network

volumes:
  db_data:
    driver: local
  uploads_data:
    driver: local

networks:
  grievance_network:
    driver: bridge
